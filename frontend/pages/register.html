<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/register.css" />
    <title>Crear cuenta | Whodunnit404</title>
  </head>
  <body>
    <main class="form-container">
      <section class="register-card">
        <p class="stamp">
          CONFIDENCIAL
          <span>EXPEDIENTE NO. 404</span>
        </p>
        <div class="brand">
          <div class="logo-circle">
            <img src="../assets/icons/search.svg" alt="" />
          </div>
          <h1 class="title">WHODUNNIT<span>404</span></h1>
        </div>
        <p class="subtitle">Abre tu expediente</p>
        <div class="divider"></div>
        <form id="register-form" novalidate>
          <p class="form-alert" id="form-alert" hidden></p>
          <div class="input-item" data-field="username">
            <label for="username">Nombre de usuario *</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Ej. Detective_Valdez"
            />
            <p class="error-message"></p>
          </div>

          <div class="input-item" data-field="email">
            <label for="email">Correo electrónico *</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="agente@whodunnit404.com"
            />
            <p class="error-message"></p>
          </div>

          <div class="input-item" data-field="password">
            <label for="password">Contraseña *</label>
            <div class="password-box">
              <input type="password" id="password" name="password" placeholder="••••••••"/>
              <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                <img src="../assets/icons/eye.svg" alt="" />
              </button>
            </div>
            <ul class="requirements" id="requirements">
              <li data-rule="length">Mínimo 8 caracteres</li>
              <li data-rule="uppercase">Una mayúscula</li>
              <li data-rule="lowercase">Una minúscula</li>
              <li data-rule="number">Un número</li>
            </ul>
            <p class="error-message"></p>
          </div>

          <div class="input-item" data-field="confirmPassword">
            <label for="confirmPassword">Verificar contraseña *</label>
            <div class="password-box">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="••••••••"
              />
              <button type="button" class="toggle-password" aria-label="Mostrar contraseña">
                <img src="../assets/icons/eye.svg" alt="" />
              </button>
            </div>
            <p class="match-message"></p>
            <p class="error-message"></p>
          </div>

          <button type="submit" class="btn-primary" id="submit-btn">
            Crear cuenta
          </button>

          <p class="support">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
          </p>
        </form>

        <div class="success" id="success" hidden>
          <h2>¡Expediente creado!</h2>
          <p>Entrando al menú...</p>
        </div>
      </section>
    </main>

    <script src="../js/register.js"></script>
  </body>
</html>
