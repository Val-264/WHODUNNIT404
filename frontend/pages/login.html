<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Iniciar sesión | Whodunnit404</title>
  </head>
  <body>
    <main class="form-container">
      <section class="register-card">
        <p class="stamp">
          CONFIDENCIAL
          <span>EXPEDIENTE NO. 404</span>
        </p>

        <div class="brand">
          <div class="logo-circle">
            <img src="../assets/icons/search.svg" alt="" />
          </div>
          <h1 class="title">WHODUNNIT<span>404</span></h1>
        </div>
        <p class="subtitle">Retoma tu investigación</p>
        <div class="divider"></div>

        <form id="login-form" novalidate>
          <div class="input-item" data-field="identifier">
            <label for="identifier">Nombre de usuario o correo</label>
            <input
              type="text"
              id="identifier"
              name="identifier"
              placeholder="Usuario o correo"
              autocomplete="username"
            />
            <p class="error-message"></p>
          </div>

          <div class="input-item" data-field="password">
            <label for="password">Contraseña</label>
            <div class="password-box">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password"
                aria-label="Mostrar contraseña"
              >
                <img src="../assets/icons/eye.svg" alt="" />
              </button>
            </div>
            <p class="error-message"></p>
          </div>

          <p class="form-alert" id="form-alert" hidden></p>

          <button type="submit" class="btn-primary" id="submit-btn">
            Iniciar sesión
          </button>

          <p class="support">
            ¿Eres nuevo? <a href="register.html">Regístrate</a>
          </p>
        </form>
      </section>
    </main>

    <script src="../js/login.js"></script>
  </body>
</html>
